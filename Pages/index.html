<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="../Css/styles.css">
    <title>Document</title>
</head>
<body>

  <main id="app"></main>

  <template id="Login">
      <div class="login-container">
        <div class="login-card card shadow-sm">
          <div class="card-body">
            <!-- Espacio para logo -->
            <div class="login-logo mb-4 text-center">
              <img src="../Img/logo.png" alt="Logo" class="img-fluid">
            </div>
            <h3 class="card-title text-center mb-4">LogIn</h3>
            <form>
              <div class="mb-3">
                <label for="inputRegistedUser" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="inputRegistedUser" placeholder="Usuario">
              </div>
              <div class="mb-3">
                <label for="inputRegistedPassword" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="inputRegistedPassword" placeholder="Contraseña">
              </div>
              <div class="mb-3">
                <select class="form-select" id="inputUserType" aria-label="Default select example">
                  <option value="">Seleccione una opción</option>
                  <option value="Cliente">Cliente</option>
                  <option value="Paseador">Paseador</option>
                </select>
              </div>
              <div class="d-grid mb-3">
                <button type="button" id="logInButton" class="btn btn-primary">Ingresar</button>
              </div>
              <p class="text-center small">
                ¿No tienes una cuenta? Regístrate
                <a href="#" id="toSignClient">Cliente</a> |
                <a href="#" id="toSignWalker">Paseador</a>
              </p>
            </form>
          </div>
        </div>
      </div>
  </template>    
  <template id="SingUpClient">
    <div class="form-container">
      <div class="form-card card shadow-sm">
        <div class="card-body">
          <div class="form-logo mb-4 text-center">
            <img src="../Img/logo.png" alt="Logo" class="img-fluid">
          </div>
          <h3 class="card-title text-center mb-4">Registro Clientes</h3>
          <form>
            <div class="mb-3">
              <label for="inputName" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="inputName" placeholder="Nombre">
            </div>
            <div class="mb-3">
              <label for="inputLastName" class="form-label">Apellido</label>
              <input type="text" class="form-control" id="inputLastName" placeholder="Apellido">
            </div>
            <div class="mb-3">
              <label for="inputUserName" class="form-label">Nombre de usuario</label>
              <input type="text" class="form-control" id="inputUserName" placeholder="Usuario">
            </div>
            <div class="mb-3">
              <label for="inputPassword" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="inputPassword" placeholder="Contraseña">
            </div>
            <div class="mb-3">
              <label for="inputDogName" class="form-label">Nombre del perro</label>
              <input type="text" class="form-control" id="inputDogName" placeholder="Nombre">
            </div>
            <div class="mb-4">
              <label for="inputDogSize" class="form-label">Tamaño del perro</label>
              <select id="inputDogSize" class="form-select">
                <option value="">Seleccionar</option>
                <option value="1">Chico</option>
                <option value="2">Mediano</option>
                <option value="4">Grande</option>
              </select>
            </div>
            <div class="d-grid">
              <button type="button" id="registerClient" class="btn btn-primary">Registrarse</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </template>
  <template id="SignUpWalker">
    <div class="form-container">
      <div class="form-card card shadow-sm">
        <div class="card-body">
          <div class="form-logo mb-4 text-center">
            <img src="../Img/logo.png" alt="Logo" class="img-fluid">
          </div>
          <h3 class="card-title text-center mb-4">Registro Paseadores</h3>
          <form>
            <div class="mb-3">
              <label for="inputName" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="inputName" placeholder="Nombre">
            </div>
            <div class="mb-3">
              <label for="inputLastName" class="form-label">Apellido</label>
              <input type="text" class="form-control" id="inputLastName" placeholder="Apellido">
            </div>
            <div class="mb-3">
              <label for="inputUserName" class="form-label">Nombre de usuario</label>
              <input type="text" class="form-control" id="inputUserName" placeholder="Usuario">
            </div>
            <div class="mb-3">
              <label for="inputPassword" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="inputPassword" placeholder="Contraseña">
            </div>
            <div class="mb-4">
              <label for="inputSlot" class="form-label">Capacidad de camioneta</label>
              <input type="number" class="form-control" id="inputSlot" placeholder="Capacidad">
            </div>
            <div class="d-grid">
              <button type="button" id="registerWalker" class="btn btn-primary">Registrarse</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </template>
  <template id="availableWalkers">
    <nav class="navbar navbar-light bg-light">
      <button type="button" id="btnOutAW" class="btn btn-secondary">Cerrar Sesion</button>
    </nav>
    <div class="table-wrapper">
      <div class="card border-dark mb-3">
        <div class="card-body">
          <h3 class="card-title">Paseadores Disponibles</h3>
          <div class="table-container">
            <table class="table">
              <thead>
                <tr>
                  <th scope="col">Nombre</th>
                  <th scope="col">Apellido</th>
                  <th scope="col">Espacio Disponible</th>
                  <th scope="col">Solicitar</th>
                </tr>
              </thead>
              <tbody id="showAviableWalkers">
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div> 
  </template>
  <template id="clientHiringSend">
    <button type="button" id="btnOutCHS" class="btn btn-secondary">Cerrar Sesion</button>
    <div class="notification-wrapper">
      <div class="notification-card card">
        <div class="card-header">
          Contratación
        </div>
        <div class="card-body">
          <h5 class="card-title">Contratación Pendiente</h5>
          <p class="card-text">Espera a que el paseador gestione su contratación.</p>
        </div>
      </div>
    </div>
  </template>
  <template id="walkerHirings">
<nav class="navbar navbar-light bg-light">
  <button type="button" id="btnOutWH" class="btn btn-secondary">Cerrar Sesión</button>
</nav>
<div class="table-wrapper">
  <div class="card border-dark mb-3">
    <div class="card-body">
      <h3 class="card-title">Información</h3>
      <div class="table-container">
        <table class="table" id="tableStats">
          <thead>
            <tr>
              <th scope="col">Cupos ocupados</th>
              <th scope="col">Cupos máximos</th>
              <th scope="col">% cupos asignados</th>
            </tr>
          </thead>
          <tbody id="tableStatsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card border-dark mb-3">
    <div class="card-body">
      <h3 class="card-title">Pendientes</h3>
      <div class="table-container">
        <table class="table" id="tablePend">
          <thead>
            <tr>
              <th scope="col">Cliente</th>
              <th scope="col">Perro</th>
              <th scope="col">Tamaño</th>
              <th scope="col">Estado</th>
              <th scope="col">Gestionar</th>
            </tr>
          </thead>
          <tbody id="tablePendBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card border-dark mb-3">
    <div class="card-body" id="card-body-aprob">
      <h3 class="card-title">Aprobadas</h3>
      <div class="table-container">
        <table class="table" id="tableAprob">
          <thead>
            <tr>
              <th scope="col">Cliente</th>
              <th scope="col">Perro</th>
              <th scope="col">Tamaño</th>
              <th scope="col">Estado</th>
            </tr>
          </thead>
          <tbody id="tableAprobBody"></tbody>
        </table>
      </div>
      <div id="message"></div>
    </div>
  </div>
</div>
  </template>

<script src="../Js/entites/client.js"></script>
<script src="../Js/entites/dog.js"></script>
<script src="../Js/entites/hiring.js"></script>
<script src="../Js/entites/walker.js"></script>
<script src="../Js/entites/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../Js/utils/Validation.js"></script>
<script src="../Js/utils/Navigate.js"></script>
<script src="../Js/pages/login.js"></script>
<script src="../Js/pages/signUpClient.js"></script>
<script src="../Js/pages/signUpWalker.js"></script>
<script src="../Js/pages/aviablesWalkers.js"></script>
<script src="../Js/pages/sendHirings.js"></script>
<script src="../Js/pages//contrataciones.js"></script>
<script src="../Js/pages/index.js"></script>
</body>
</html>
